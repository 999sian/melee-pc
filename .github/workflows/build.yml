name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Tag builds publish a release; everything else just produces artifacts.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format python3

      - name: Verify code style and formatting
        run: python3 tools/check_style.py

      - name: Verify game syntax
        run: python3 tools/compile_check.py

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # SDL3 is not in Ubuntu 24.04, so aurora builds it from source
          # (AURORA_SDL3_PROVIDER=vendor); these are its X11/Wayland/audio deps.
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libssl-dev libcurl4-openssl-dev zip file desktop-file-utils \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgbm-dev

      - name: Build and package
        run: tools/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/Melee-${{ matrix.arch }}.AppImage
            dist/melee-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            toolchain: mingw-w64
          - arch: arm64
            toolchain: llvm-mingw
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip cabextract curl

      - name: Install MinGW-w64 toolchain (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends mingw-w64
          # aurora's C++20 code needs std::thread, which only the POSIX
          # threading model provides; Ubuntu defaults some links to win32.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install LLVM-MinGW and GCC AArch64 (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-ubuntu-22.04-x86_64.tar.xz"
          sudo mkdir -p /opt/llvm-mingw
          curl -sSL "${LLVM_MINGW_URL}" | sudo tar -xJ -C /opt/llvm-mingw --strip-components=1
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Build and package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: tools/package_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/Melee-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The decomp needs scalar_storage_order, which the NDK's Clang does
          # not implement, so tools/gcc_launcher.py routes melee_game through
          # this cross compiler with the NDK sysroot.
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake gcc-aarch64-linux-gnu
          # nod has no Android prebuilt, so aurora builds it from Rust source.
          rustup target add aarch64-linux-android
          # aurora uses std::jthread/std::stop_token, which the runner's
          # newest NDK libc++ does not expose. r26 is the version this port
          # is developed against.
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;26.3.11579264' > /dev/null

      - name: Build APK
        env:
          MELEE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.7' }}
          MELEE_KEYSTORE_BASE64: ${{ secrets.MELEE_KEYSTORE_BASE64 }}
          MELEE_KEYSTORE_PASSWORD: ${{ secrets.MELEE_KEYSTORE_PASSWORD }}
          MELEE_KEY_ALIAS: ${{ secrets.MELEE_KEY_ALIAS }}
          MELEE_KEY_PASSWORD: ${{ secrets.MELEE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.3.11579264"
          tools/build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/Melee-Android-arm64.apk
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          xcodebuild -version
          # Apple clang builds the C++; the decomp's C needs GCC for
          # scalar_storage_order, so tools/gcc_launcher.py routes melee_game
          # through Homebrew's gcc. SDL3 comes from Homebrew and is bundled
          # into the .app with the other dylibs by package_macos.sh.
          brew install gcc cmake ninja sdl3 zstd libpng freetype

      - name: Build and package
        env:
          MELEE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.7' }}
        run: tools/package_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Melee-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  ios:
    name: iOS (arm64, IPA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake gcc-aarch64-linux-gnu \
            clang-19 lld-19 llvm-19 zip python3 || \
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake gcc-aarch64-linux-gnu \
            clang lld llvm zip python3
          for tool in clang clang++ ld.lld ld64.lld llvm-ar llvm-ranlib llvm-strip llvm-otool llvm-install-name-tool; do
            if command -v "${tool}-19" >/dev/null 2>&1; then
              sudo ln -sf "$(command -v "${tool}-19")" "/usr/local/bin/${tool}"
            fi
          done
          sudo ln -sf "$(command -v llvm-install-name-tool || which llvm-install-name-tool)" /usr/local/bin/install_name_tool || true
          sudo ln -sf "$(command -v llvm-otool || which llvm-otool)" /usr/local/bin/otool || true

      - name: Checkout iOS SDK
        run: |
          mkdir -p /tmp/sdks
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk

      - name: Setup Rust for iOS
        run: |
          rustup target add aarch64-apple-ios

      - name: Build and package iOS IPA
        env:
          IOS_SDK_PATH: /tmp/sdks/iPhoneOS16.5.sdk
        run: tools/build_ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: dist/Melee-iOS-arm64.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows, android, ios, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh artifacts
          # A tag containing a hyphen (v0.1.0-beta) is a prerelease.
          prerelease=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            ${prerelease} \
            artifacts/*
